<div id="tabs">

  <div id="tl"></div>
  <button id="add" title="Новая вкладка (Ctrl+T)"><svg class="i"><use href="#i-plus"/></svg></button>
</div>

<div id="bar">
  <button id="bk" title="Назад (Alt+←)"><svg class="i"><use href="#i-back"/></svg></button>
  <button id="fw" title="Вперёд (Alt+→)"><svg class="i"><use href="#i-fwd"/></svg></button>
  <button id="rl" title="Обновить (Ctrl+R)"><svg class="i"><use href="#i-reload"/></svg></button>
  <button id="hm" title="Стартовая страница (Alt+Home)"><svg class="i"><use href="#i-home"/></svg></button>
  <div id="ub"><span id="sec"></span><input id="url" placeholder="Поиск или адрес сайта" spellcheck="false" autocomplete="off"><button id="zm" title="Сбросить масштаб (Ctrl+0)"></button></div>
  <button id="st" title="В закладки (Ctrl+D)"><svg class="i"><use href="#i-star"/></svg></button>
  <button id="moon" title="Лунный режим: тёмная тема для любого сайта (Ctrl+Shift+M)"><svg class="i"><use href="#i-moon"/></svg></button>
  <button id="rd" title="Режим чтения (F9)"><svg class="i"><use href="#i-book"/></svg></button>
  <button id="sh" title="Блокировка трекеров"><svg class="i"><use href="#i-shield"/></svg><b id="cnt">0</b></button>
  <button id="dl" title="Загрузки (Ctrl+J)"><svg class="i"><use href="#i-dl"/></svg></button>
  <button id="ex" title="Расширения"><svg class="i"><use href="#i-puz"/></svg></button>
  <button id="mn" title="Меню"><svg class="i"><use href="#i-menu"/></svg></button>
</div>

<div id="perm"></div>

    <div id="moonbg"></div>
    <div id="mascot" aria-hidden="true"></div>
    <div id="hlogo"></div>

    <div id="sbox"><input id="q" spellcheck="false" autocomplete="off"><button id="eng"></button></div>
    <div id="scopes"></div>
    <div id="tiles"></div>
    <div id="freqw" class="no"><small>Часто посещаемые</small><div id="freq"></div></div>
    <button id="snd" title="Звук обоев"></button>
  </div>
  <div id="reader"></div>
  <div id="find"><input id="fq" placeholder="Найти на странице" spellcheck="false"><span id="fc"></span>
    <button id="fp" title="Предыдущее"><svg class="i s"><use href="#i-up"/></svg></button><button id="fn" title="Следующее"><svg class="i s"><use href="#i-down"/></svg></button><button id="fx" title="Закрыть (Esc)"><svg class="i s"><use href="#i-close"/></svg></button></div>
  <div id="panel"></div>
  <div id="toast"></div>
  <div id="welcome"></div>
  <div id="ban"></div>
  <div id="evbar"></div>
</div>
